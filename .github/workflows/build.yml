name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true
      - name: Use stable signing key
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p "$HOME/.android"
            echo "$KS" | base64 -d > "$HOME/.android/debug.keystore"
            echo "Stable keystore installed"
          else
            echo "No DEBUG_KEYSTORE secret - temporary key will be used"
          fi
      - name: Install npm dependencies
        run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: Sync web assets
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: putevoy-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
